<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>12 Abilene Drive · Basement 3D</title>
<style>
:root{--wal:#8A5A2E;--ink:#1B2A32;--grey:#6B7280;--bg:#faf8f5;--line:#d9d4cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
#top{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:8px 14px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
#top img{height:34px;width:auto;display:block}
#ttl{font-size:17px;font-weight:700;color:var(--ink);line-height:1.15}
#ttl small{display:block;font-weight:400;font-size:12.5px;color:var(--grey)}
#note{margin-left:auto;font-size:13px;color:var(--wal);font-weight:600;text-align:right}
#walk{border:1px solid var(--wal);background:#fff;color:var(--wal);padding:7px 12px;border-radius:3px;font-size:14px;text-decoration:none;white-space:nowrap}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-50%);font-size:13px;font-weight:700;color:#1B2A32;background:rgba(255,255,255,.88);border:1px solid rgba(138,90,46,.55);padding:3px 8px;border-radius:12px;white-space:nowrap;transition:opacity .25s}
.lb.minor{font-weight:500;font-size:11.5px;color:#6B7280;border-color:#cfc8bd;background:rgba(255,255,255,.7)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.95);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
#bar button{flex:0 0 auto;border:1px solid var(--wal);background:#fff;color:var(--wal);padding:10px 14px;font:inherit;font-size:15px;cursor:pointer;border-radius:4px;white-space:nowrap}
#bar button.on{background:var(--wal);color:#fff}
#extra{position:fixed;right:12px;bottom:68px;z-index:5;display:none;gap:8px}
#extra a{background:var(--wal);color:#fff;font-size:14px;font-weight:600;padding:9px 13px;border-radius:5px;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#hint{position:fixed;left:12px;bottom:68px;z-index:4;font-size:12.5px;color:var(--grey);background:rgba(255,255,255,.8);padding:4px 8px;border-radius:4px}
#err{position:fixed;inset:80px 20px auto 20px;z-index:9;display:none;background:#fff;border:1px solid var(--wal);padding:14px;font-size:15px}
@media(max-width:720px){#ttl small{display:none}#note{display:none}}
</style>
</head>

  g.fillStyle=line;for(let i=0;i<=n;i++){g.fillRect(i*h-1,0,2,S);g.fillRect(0,i*h-1,S,2)}},256)}
const T={
 hw1:{t:woodTex('#b08d62',22,8),ts:4},      /* HW 1 Zen Light, as drawn */

 turf:{t:noiseTex('#6f7a72',.16),ts:3}
};

for(const k in T){T[k].t.repeat.set(1,1);MAT[k]=new THREE.MeshLambertMaterial({map:T[k].t})}

ground.rotation.x=-Math.PI/2;ground.position.y=-2.2;scene.add(ground);

function boxMesh(x1,y1,x2,y2,z0,z1,mat,edges){
  const w=(x2-x1)*IN,d=(y2-y1)*IN,h=(z1-z0)*IN;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(((x1+x2)/2-CX)*IN,((z0+z1)/2)*IN,-((y1+y2)/2-CY)*IN);
  if(edges){const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),mEdge);m.add(e)}
  return m}

/* floors */
function floor(rects,key,z){
  const t=T[key];
  rects.forEach(r=>{const [x1,y1,x2,y2]=r;
    const g=new THREE.PlaneGeometry((x2-x1)*IN,(y2-y1)*IN);g.rotateX(-Math.PI/2);
    const cx=((x1+x2)/2-CX)*IN,cz=-((y1+y2)/2-CY)*IN;g.translate(cx,(z||0)*IN,cz);
    const p=g.attributes.position,uv=g.attributes.uv;
    for(let i=0;i<p.count;i++){uv.setXY(i,p.getX(i)/t.ts,-p.getZ(i)/t.ts)}
    scene.add(new THREE.Mesh(g,MAT[key]))})}

/* ---------- walls ---------- */
const WALLS=[];
function wall(r,gaps){
  const [x1,y1,x2,y2]=r;const horiz=(x2-x1)>=(y2-y1);
  const a0=horiz?x1:y1,a1=horiz?x2:y2,p0=horiz?y1:x1,p1=horiz?y2:x2;
  const g=new THREE.Group();g.position.y=BASE*IN;
  const add=(m)=>{m.position.y-=BASE*IN;g.add(m)};
  const seg=(a,b,z0,z1,mat,edge)=>{if(b-a<0.1||z1-z0<0.1)return;
    add(horiz?boxMesh(a,p0,b,p1,z0,z1,mat,edge):boxMesh(p0,a,p1,b,z0,z1,mat,edge))};
  const gs=(gaps||[]).slice().sort((u,v)=>u[0]-v[0]);let cur=a0;
  gs.forEach(q=>{const [a,b,sill,head,kind]=q;
    seg(cur,a,BASE,H,mWall,true);
    seg(a,b,BASE,sill>0?sill:0,mWall,false);
    seg(a,b,head,H,mWall,true);
    if(kind==='w'){add(horiz?boxMesh(a,(p0+p1)/2-.6,b,(p0+p1)/2+.6,sill,head,mGlass):boxMesh((p0+p1)/2-.6,a,(p0+p1)/2+.6,b,sill,head,mGlass));
      seg(a,b,sill-1.5,sill,mFrame);seg(a,b,head,head+1.5,mFrame)}
    if(kind==='g'){add(horiz?boxMesh(a,(p0+p1)/2-.6,b,(p0+p1)/2+.6,0,head,mGlass):boxMesh((p0+p1)/2-.6,a,(p0+p1)/2+.6,b,0,head,mGlass));
      const n=Math.max(2,Math.round((b-a)/36));for(let i=0;i<=n;i++){const c=a+(b-a)*i/n;seg(c-.8,c+.8,0,head,mFrame)}
      seg(a,b,head-1.5,head,mFrame)}
    if(kind==='d'){const len=b-a;const piv=new THREE.Group();
      const hp=horiz?W3(a,(p0+p1)/2,0):W3((p0+p1)/2,a,0);piv.position.set(hp.x,hp.y-BASE*IN,hp.z);
      const lf=new THREE.Mesh(new THREE.BoxGeometry(len*IN,(head-1)*IN,1.75*IN),mDoor);lf.position.set(len*IN/2,(head-1)*IN/2,0);
      piv.add(lf);piv.rotation.y=(horiz?0:Math.PI/2)-1.75;g.add(piv)}
    cur=b});
  seg(cur,a1,BASE,H,mWall,true);
  scene.add(g);
  const cx=(x1+x2)/2,cy=(y1+y2)/2;
  WALLS.push({g,cx,cy,full:1,target:1,low:(36-BASE)/(H-BASE)});
  return g}
function block(r){const m=boxMesh(r[0],r[1],r[2],r[3],BASE,H,mBlock,true);m.position.y-=BASE*IN;const g=new THREE.Group();g.position.y=BASE*IN;g.add(m);scene.add(g);
  WALLS.push({g,cx:(r[0]+r[2])/2,cy:(r[1]+r[3])/2,full:1,target:1,low:(36-BASE)/(H-BASE)})}

/* ---------- areas ---------- */
const AREAS={
 all:{name:'Whole basement',bb:[306,184,1030,974],cx:700,cy:580,th:-.25,ph:.5,r:118,cut:null},
 hall:{name:'Stair hall and display',bb:[532,432,850,690],dir:[0,-1],th:0,ph:1.0,r:62,ex:[0,0]},
 rec:{name:'Rec room',bb:[648,654,998,963],dir:[0,-1],th:0,ph:1.0,r:80},
 golf:{name:'Golf room',bb:[367,688,626,945],dir:[0,-1],th:0,ph:1.0,r:62,golf:1},
 wine:{name:'Wine room',bb:[572,736,648,945],dir:[1,0],th:Math.PI/2,ph:1.0,r:48},
 mech:{name:'Mechanical',bb:[306,372,532,665],dir:[1,0],th:Math.PI/2,ph:1.0,r:58},
 gym:{name:'Gym and shower',bb:[726,184,962,436],dir:[0,1],th:Math.PI,ph:1.0,r:58},

 laundry:{name:'Laundry',bb:[547,346,640,432],dir:[0,1],th:Math.PI,ph:1.0,r:32}
};
const KEYS=['all','hall','rec','golf','wine','mech','gym','bed','laundry'];
const BTN={all:'Whole basement',hall:'Stair hall and display',rec:'Rec room',golf:'Golf room',wine:'Wine room',mech:'Mechanical',gym:'Gym and shower',bed:'Bedroom 5, walk-in, ensuite',laundry:'Laundry'};
const LINK={all:'all',hall:'hall',rec:'rec',golf:'golf',wine:'wine',mech:'mech',gym:'gym',bed:'bed',laundry:'laundry'};
KEYS.forEach(k=>{const a=AREAS[k];if(k!=='all'){a.cx=(a.bb[0]+a.bb[2])/2;a.cy=(a.bb[1]+a.bb[3])/2}});

/* labels */
const LAB=[
 {t:'Stair hall and display',x:690,y:560,a:'hall'},{t:'Rec room',x:830,y:830,a:'rec'},{t:'Golf room',x:480,y:820,a:'golf'},
 {t:'Wine room',x:606,y:850,a:'wine'},{t:'Mechanical',x:445,y:520,a:'mech'},{t:'Gym',x:795,y:300,a:'gym'},
 {t:'Shower, toilet, sauna',x:908,y:300,a:'gym'},{t:'Bedroom 5',x:455,y:275,a:'bed'},{t:'Walk-in',x:595,y:268,a:'bed'},{t:'Ensuite',x:685,y:290,a:'bed'},
 {t:'Laundry',x:593,y:392,a:'laundry'},{t:'Elevator',x:585,y:635,minor:1},{t:'Cold cellar',x:330,y:560,minor:1},{t:'Walk-out',x:940,y:545,minor:1},{t:'Stair up',x:640,y:480,minor:1}];
const labDiv=document.getElementById('labels');
LAB.forEach(l=>{const d=document.createElement('div');d.className='lb'+(l.minor?' minor':'');d.textContent=l.t;labDiv.appendChild(d);l.d=d;l.p=W3(l.x,l.y,(H+6))});

/* ---------- camera state and orbit ---------- */
const S={tx:0,ty:0,tz:0,r:132,th:-.25,ph:.5};
function applyCam(){const sp=Math.sin(S.ph);
  cam.position.set(S.tx+S.r*sp*Math.sin(S.th),S.ty+S.r*Math.cos(S.ph),S.tz+S.r*sp*Math.cos(S.th));
  cam.lookAt(S.tx,S.ty,S.tz)}
let fly=null;
function goto(k,instant){
  const a=AREAS[k];const p=W3(a.cx,a.cy,k==='all'?0:30);
  const to={tx:p.x,ty:p.y,tz:p.z,r:a.r,th:a.th,ph:a.ph};
  if(k==='all'){to.ph=.42}
  else{to.ph=0.74}
  if(instant){Object.assign(S,to);applyCam()}else{fly={from:Object.assign({},S),to,t:0}}
  curArea=k;cut(k);
  [...document.querySelectorAll('#bar button')].forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  document.getElementById('extra').style.display=(k==='golf')?'flex':'none';
  document.getElementById('hint').style.opacity=k==='all'?1:0.0}
let curArea='all';
function cut(k){const a=AREAS[k];
  WALLS.forEach(w=>{let low=false;
    if(k!=='all'&&a.dir){const R=[a.cx,a.cy];const hx=(a.bb[2]-a.bb[0])/2,hy=(a.bb[3]-a.bb[1])/2;
      const s=(w.cx-R[0])*a.dir[0]+(w.cy-R[1])*a.dir[1];const half=Math.abs(a.dir[0])*hx+Math.abs(a.dir[1])*hy;
      const inside=w.cx>a.bb[0]-140&&w.cx<a.bb[2]+140&&w.cy>a.bb[1]-140&&w.cy<a.bb[3]+140;
      low=inside&&s>0.45*half}
    w.target=low?w.low:1})}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function angDelta(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}

/* pointer input: one finger turns, two fingers pinch and move */
const ptr=new Map();let last=null;
function stop(){fly=null}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});stop();last=null});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);last=null});
cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);last=null});
function pan(dx,dy){const k=S.r*.0016;
  const rx=Math.cos(S.th),rz=-Math.sin(S.th);          /* screen right in world */
  const fx=-Math.sin(S.th),fz=-Math.cos(S.th);         /* screen up on the ground */
  S.tx+=(-dx*rx+dy*fx)*k;S.tz+=(-dx*rz+dy*fz)*k}
cv.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);const px=p.x,py=p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===1){
    if(e.shiftKey||e.buttons===2){pan(e.clientX-px,e.clientY-py)}
    else{S.th-=(e.clientX-px)*.007;S.ph=Math.max(.12,Math.min(1.5,S.ph-(e.clientY-py)*.006))}
  }else if(ptr.size===2){
    const [a,b]=[...ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    if(last){S.r=Math.max(8,Math.min(240,S.r*last.d/d));pan(m.x-last.m.x,m.y-last.m.y)}
    last={d,m}}
  applyCam()});
cv.addEventListener('wheel',e=>{e.preventDefault();stop();S.r=Math.max(8,Math.min(240,S.r*(1+e.deltaY*.0012)));applyCam()},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- UI ---------- */
const bar=document.getElementById('bar');
KEYS.forEach(k=>{const b=document.createElement('button');b.textContent=BTN[k];b.dataset.k=k;
  b.onclick=()=>{location.hash=k==='all'?'':LINK[k];goto(k)};bar.appendChild(b)});
function fromHash(inst){const h=location.hash.replace('#','');goto(AREAS[h]?h:'all',inst)}
window.addEventListener('hashchange',()=>fromHash(false));

function resize(){const w=window.innerWidth,h=window.innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.setViewOffset(w,h,0,34,w,h);cam.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();

let prev=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-prev)/1000);prev=now;
  if(fly){fly.t=Math.min(1,fly.t+dt/1.2);const e=ease(fly.t),f=fly.from,t=fly.to;
    S.tx=f.tx+(t.tx-f.tx)*e;S.ty=f.ty+(t.ty-f.ty)*e;S.tz=f.tz+(t.tz-f.tz)*e;S.r=f.r+(t.r-f.r)*e;
    S.ph=f.ph+(t.ph-f.ph)*e;S.th=f.th+angDelta(f.th,t.th)*e;if(fly.t>=1)fly=null}
  WALLS.forEach(w=>{const d=w.target-w.full;if(Math.abs(d)>.002){w.full+=d*Math.min(1,dt*7);w.g.scale.y=w.full}else if(w.full!==w.target){w.full=w.target;w.g.scale.y=w.full}});
  applyCam();ren.render(scene,cam);
  const W=window.innerWidth,Hh=window.innerHeight;
  LAB.forEach(l=>{const v=l.p.clone().project(cam);const show=v.z<1&&(curArea==='all'||l.a===curArea);
    l.d.style.opacity=show?1:0;if(show){l.d.style.left=((v.x+1)/2*W)+'px';l.d.style.top=((1-v.y)/2*Hh)+'px'}});
  requestAnimationFrame(tick)}
fromHash(true);requestAnimationFrame(tick);
})();
</script>
